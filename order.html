<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pre-order your favorite bubble tea from WEDRINK at MEGA Silk Way Astana.">
    <meta name="author" content="Yasmina">
    <title>WEDRINK Astana | Pre-Order</title></head>
<body>
    <header>
        <h1>WEDRINK Pre-Order</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order.html">Pre-Order</a></li>
                <li><a href="colophon.html">Colophon</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="order-form-section">
            <h2>Place Your Order</h2>
            
            <!-- Note: The form does not send anything yet - there is no server behind it. Server-side handling comes later in the course. -->

            <form action="#" method="post">
                <fieldset>
                    <legend>Customer Information</legend>
                    <p>
                        <label for="full-name">Full Name:*</label><br>
                        <input type="text" id="full-name" name="full_name" placeholder="Arman Aliyev" required>
                    </p>
                    <p>
                        <label for="email">Email Address:*</label><br>
                        <input type="email" id="email" name="user_email" placeholder="example@mail.com" required>
                    </p>
                    <p>
                        <label for="phone">Phone Number:*</label><br>
                        <input type="tel" id="phone" name="user_phone" placeholder="+7 707 123 45 67" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Drink Customization</legend>
                    <p>
                        <label for="drink-select">Select Drink:*</label><br>
                        <select id="drink-select" name="drink_choice" required>
                            <option value="">-- Choose an option --</option>
                            <option value="boba-milk-tea">Classic Boba Milk Tea</option>
                            <option value="fruit-bucket">Super Fruit Bucket</option>
                            <option value="matcha-sundae">Matcha Sundae</option>
                        </select>
                    </p>
                    <p>
                        <label for="quantity">Quantity:*</label><br>
                        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required>
                    </p>
                    <p>
                        <label for="pickup-date">Pickup Date & Time:*</label><br>
                        <input type="date" id="pickup-date" name="pickup_date" required>
                    </p>
                    <p><strong>Sugar Level:</strong><br>
                        <input type="radio" id="sugar-0" name="sugar" value="0%">
                        <label for="sugar-0">0% (No Sugar)</label><br>
                        <input type="radio" id="sugar-50" name="sugar" value="50%" checked>
                        <label for="sugar-50">50% (Standard)</label><br>
                        <input type="radio" id="sugar-100" name="sugar" value="100%">
                        <label for="sugar-100">100% (Extra Sweet)</label>
                    </p>
                    <p><strong>Extra Toppings:</strong><br>
                        <input type="checkbox" id="topping-boba" name="toppings" value="extra-boba">
                        <label for="topping-boba">Extra Tapioca Boba</label><br>
                        <input type="checkbox" id="topping-jelly" name="toppings" value="coconut-jelly">
                        <label for="topping-jelly">Coconut Jelly</label>
                    </p>
                    <p>
                        <label for="notes">Special Instructions:</label><br>
                        <textarea id="notes" name="notes" rows="4" cols="40" placeholder="Add extra ice or special requests..."></textarea>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Submit Order</button>
                    <button type="reset">Reset Form</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Contacts: <a href="tel:+77172735080">+7 (7172) 73-50-80</a> | <a href="mailto:info@wedrink.kz">info@wedrink.kz</a></p>
        <p>&copy; 2026 WEDRINK Astana. All rights reserved.</p>
    </footer>
    
</body>
</html>
